<!DOCTYPE html>
<html lang="id">
<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="description"
        id="meta-description"
        content="Artikel FaezaProject"
    >

    <meta
        name="theme-color"
        content="#0b1f3a"
    >

    <title>Blog | FaezaProject</title>


    <!-- =================================================
         CSS UTAMA
         ================================================= -->

    <link
        rel="stylesheet"
        href="css/style.css"
    >

    <link
        rel="stylesheet"
        href="css/blog-detail.css"
    >


    <!-- =================================================
         FAVICON
         ================================================= -->

    <link
        rel="icon"
        href="assets/favicon.png"
    >

</head>


<body>


    <!-- =================================================
         PAGE
         ================================================= -->

    <main class="blog-detail-page">


        <!-- =============================================
             HERO
             ============================================= -->

        <section
            class="blog-detail-hero"
        >

            <div class="container">

                <span
                    id="article-category"
                >
                    Blog
                </span>


                <h1
                    id="article-title"
                >
                    Memuat artikel...
                </h1>


                <time
                    id="article-date"
                    datetime=""
                >
                    -
                </time>

            </div>

        </section>


        <!-- =============================================
             FEATURE IMAGE
             ============================================= -->

        <div
            class="blog-detail-image"
        >

            <img
                id="article-image"
                src=""
                alt="Artikel FaezaProject"
                loading="eager"
            >

        </div>


        <!-- =============================================
             ARTICLE
             ============================================= -->

        <section
            class="blog-detail-section"
        >

            <article
                id="article-content"
                class="blog-detail-content"
            >

                <p class="article-intro">
                    Memuat artikel...
                </p>

            </article>


            <!-- =========================================
                 CTA
                 ========================================= -->

            <div
                class="blog-detail-cta"
            >

                <a
                    href="index.html#blog"
                    class="blog-back-link"
                >
                    ← Kembali ke Blog
                </a>


                <a
                    id="article-whatsapp"
                    href="#"
                    class="article-whatsapp"
                >
                    Konsultasi via WhatsApp
                </a>

            </div>

        </section>

    </main>


    <!-- =================================================
         JAVASCRIPT
         URUTAN WAJIB
         ================================================= -->

    <script src="js/blog-data.js"></script>

    <script src="js/blog-content.js"></script>

    <script src="js/blog-detail-page.js"></script>


</body>
  </html>
